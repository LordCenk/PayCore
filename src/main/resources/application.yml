spring:
  application:
    name: paycore
  datasource:
    url: ${PAYCORE_DB_URL:jdbc:postgresql://localhost:5432/paycore}
    username: ${PAYCORE_DB_USER:paycore}
    password: ${PAYCORE_DB_PASSWORD:paycore}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  data:
    redis:
      host: ${PAYCORE_REDIS_HOST:localhost}
      port: ${PAYCORE_REDIS_PORT:6379}
      # Short timeouts: Redis is an optimisation here, never a reason to make a payment wait.
      timeout: 500ms
      connect-timeout: 500ms
  kafka:
    bootstrap-servers: ${PAYCORE_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      properties:
        enable.idempotence: true
        # Fail fast when the broker is down: the relay rolls back and the events wait in the outbox.
        max.block.ms: 5000
        request.timeout.ms: 5000
        delivery.timeout.ms: 10000
    consumer:
      auto-offset-reset: earliest
      enable-auto-commit: false
    admin:
      # Don't hold up startup for long when the broker is down; topics are created once it's reachable.
      operation-timeout: 5s
      close-timeout: 2s
      properties:
        request.timeout.ms: 5000
        default.api.timeout.ms: 5000

server:
  port: ${PORT:8080}

logging:
  # Adds [requestId] to every plain-text log line. For JSON logs set LOGGING_STRUCTURED_FORMAT_CONSOLE=ecs.
  pattern:
    correlation: "[%X{requestId:-}] "

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  health:
    # Redis is optional (PayCore falls back to PostgreSQL), so its outage must not mark the app unhealthy.
    redis:
      enabled: false
  metrics:
    tags:
      application: paycore
    distribution:
      percentiles-histogram:
        paycore.processor.latency: true
        http.server.requests: true

paycore:
  # Protects /api/v1/admin/**. Set a real secret outside local development.
  admin-api-key: ${PAYCORE_ADMIN_API_KEY:admin_dev_key}
  supported-currencies: [INR, USD, EUR]
  idempotency:
    ttl: 24h
    # An IN_PROGRESS key older than this is treated as abandoned (the request crashed).
    in-progress-timeout: 60s
  processor:
    # Outcome probabilities for the mock gateway when a non-test token is used.
    success-rate: 0.7
    decline-rate: 0.2
    # Remaining probability (0.1) is a timeout.
    webhook-secret: ${PAYCORE_PROCESSOR_WEBHOOK_SECRET:whsec_mock_gateway_dev}
  retry:
    max-attempts: 5
    initial-backoff: 2s
    max-backoff: 60s
  fraud:
    max-amount: 20000000        # 2,00,000.00 in minor units
    velocity-limit: 5
    velocity-window: 1m
    blocked-tokens: [tok_blocked]
  jobs:
    enabled: true
    retry-interval: 5s
    reconciliation-interval: 60s
    reconciliation-stale-after: 2m
    outbox-interval: 1s
    webhook-delivery-interval: 5s
  webhooks:
    max-attempts: 8
    timeout: 5s
    # Keep false in any shared environment: true lets merchants point webhooks at internal services.
    allow-private-targets: ${PAYCORE_WEBHOOKS_ALLOW_PRIVATE_TARGETS:false}
  redis:
    # After a Redis error, skip Redis for this long and use PostgreSQL directly.
    failure-cooldown: 5s
    merchant-cache-ttl: 60s
  rate-limit:
    enabled: true
    # Token bucket per merchant: bursts up to `capacity`, sustained `refill-per-second`.
    capacity: 100
    refill-per-second: 20
  events:
    publisher: ${PAYCORE_EVENTS_PUBLISHER:kafka}
    topic: paycore.events
    partitions: 3
    publish-timeout: 15s
