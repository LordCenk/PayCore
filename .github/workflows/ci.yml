name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: paycore
          POSTGRES_PASSWORD: paycore
          POSTGRES_DB: paycore_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U paycore"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Unit and integration tests
        run: ./mvnw -B verify
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/

  e2e:
    name: Docker image and end-to-end smoke test
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v5
      - name: Start the full stack (PostgreSQL, Redis, Kafka, PayCore image)
        run: docker compose --profile app up -d --build
      - name: Smoke test
        run: scripts/smoke-test.sh http://localhost:8080
      - name: Install Playwright and Chromium
        run: |
          npm install --no-save --prefix /tmp/pw playwright@1.56.1
          /tmp/pw/node_modules/.bin/playwright install --with-deps chromium
      - name: Demo page in a real browser
        run: |
          mkdir -p demo-screenshots
          NODE_PATH=/tmp/pw/node_modules node scripts/demo-e2e.js http://localhost:8080 demo-screenshots
      - name: Upload demo screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: demo-screenshots
          path: demo-screenshots/
          if-no-files-found: ignore
      - name: Logs on failure
        if: failure()
        run: docker compose --profile app logs --no-color --tail 300
      - name: Stop
        if: always()
        run: docker compose --profile app down -v
