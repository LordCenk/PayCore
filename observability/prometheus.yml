global:
  scrape_interval: 10s
  evaluation_interval: 10s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: paycore
    metrics_path: /actuator/prometheus
    static_configs:
      # PayCore runs on the host (./mvnw spring-boot:run); use paycore:8080 if it runs in compose.
      - targets: ["host.docker.internal:8080"]
