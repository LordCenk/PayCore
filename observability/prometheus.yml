global:
  scrape_interval: 10s
  evaluation_interval: 10s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: paycore
    metrics_path: /actuator/prometheus
    static_configs:
      # Whichever is running: PayCore on the host (./mvnw spring-boot:run) or in compose (--profile app).
      - targets: ["host.docker.internal:8080", "paycore:8080"]
